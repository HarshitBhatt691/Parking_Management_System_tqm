<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TQM Parking Management System</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .kbd-key {
            background-color: #eee;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-shadow: 0 1px 1px rgba(0,0,0,0.2);
            color: #333;
            font-size: 0.85em;
            font-weight: 700;
            padding: 2px 6px;
        }
        [data-bs-theme="dark"] .kbd-key {
            background-color: #333;
            border-color: #555;
            color: #eee;
        }
    </style>
</head>
<body id="app-body">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">🅿️ ParkSmart TQM</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'add_vehicle' %}">Park Vehicle</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'profile_settings' %}">Profile Settings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'sqc_reports' %}">SQC Reports</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <!-- Theme Toggle Button -->
                    <button class="btn btn-outline-warning btn-sm" id="themeToggleBtn" title="Toggle Theme (Alt+T)">
                        🌙 Dark Mode
                    </button>
                    <!-- Shortcuts Cheat Sheet Button -->
                    <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#shortcutsModal" title="Shortcuts (Alt+H)">
                        ⌨️ Shortcuts
                    </button>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Main Content Container -->
    <div class="container mb-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Shortcuts Cheat Sheet Modal -->
    <div class="modal fade" id="shortcutsModal" tabindex="-1" aria-labelledby="shortcutsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="shortcutsModalLabel">⌨️ Keyboard Shortcuts</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-bordered align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Action</th>
                                <th>Shortcut Key</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Park New Vehicle</td>
                                <td><span class="kbd-key">Alt</span> + <span class="kbd-key">N</span></td>
                            </tr>
                            <tr>
                                <td>Go to Dashboard</td>
                                <td><span class="kbd-key">Alt</span> + <span class="kbd-key">D</span></td>
                            </tr>
                            <tr>
                                <td>Toggle Dark/Light Mode</td>
                                <td><span class="kbd-key">Alt</span> + <span class="kbd-key">T</span></td>
                            </tr>
                            <tr>
                                <td>Show Shortcuts Help</td>
                                <td><span class="kbd-key">Alt</span> + <span class="kbd-key">H</span> or <span class="kbd-key">?</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Theme & Shortcuts Logic -->
    <script>
        // Persistent Theme Toggle
        const htmlElement = document.documentElement;
        const themeBtn = document.getElementById('themeToggleBtn');

        function applyTheme(theme) {
            htmlElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('parksmart_theme', theme);
            if (theme === 'dark') {
                themeBtn.innerHTML = 'Light Mode';
                themeBtn.classList.replace('btn-outline-warning', 'btn-outline-light');
            } else {
                themeBtn.innerHTML = 'Dark Mode';
                themeBtn.classList.replace('btn-outline-light', 'btn-outline-warning');
            }
        }

        // Load saved theme or default to light
        const savedTheme = localStorage.getItem('parksmart_theme') || 'light';
        applyTheme(savedTheme);

        function toggleTheme() {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        themeBtn.addEventListener('click', toggleTheme);

        // Global Keyboard Shortcuts
        document.addEventListener('keydown', function(e) {
            const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);

            if (e.altKey && (e.key === 'n' || e.key === 'N')) {
                e.preventDefault();
                window.location.href = "{% url 'add_vehicle' %}";
            } else if (e.altKey && (e.key === 'd' || e.key === 'D')) {
                e.preventDefault();
                window.location.href = "{% url 'dashboard' %}";
            } else if (e.altKey && (e.key === 't' || e.key === 'T')) {
                e.preventDefault();
                toggleTheme();
            } else if ((e.altKey && (e.key === 'h' || e.key === 'H')) || (!isTyping && e.key === '?')) {
                e.preventDefault();
                const modal = new bootstrap.Modal(document.getElementById('shortcutsModal'));
                modal.show();
            }
        });
    </script>
</body>
</html>
